<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>-100 Batak | Pi Network DApp</title>
  <!-- Pi Network Resmi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1025; /* Pi Network koyu mor teması */
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 15px;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #2b193d;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid #59357a;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 4px;
    }
    .btn:disabled {
      background: #555 !important;
      cursor: not-allowed;
    }
    .btn-pi { background: #f4b41a; color: #1a1025; } /* Pi Altın Sarısı */
    .btn-ad { background: #00c853; color: white; }
    
    .table {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      max-width: 700px;
      margin: 0 auto 25px auto;
    }
    .player-card {
      background: #252525;
      padding: 18px;
      border-radius: 12px;
      border: 2px solid #444;
      transition: all 0.3s ease;
    }
    /* Puan Renk Kuralları */
    .rank-100 { background-color: #b71c1c !important; border-color: #ff5252; } /* 100+ Kırmızı */
    .rank-50 { background-color: #fbc02d !important; color: #000 !important; } /* 50-99 Sarı */
    .rank-under50 { background-color: #0277bd !important; border-color: #4fc3f7; } /* 50 Altı Mavi */

    .controls {
      background: #2b193d;
      padding: 18px;
      border-radius: 12px;
      max-width: 700px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div class="header">
    <div><strong>🃏 -100 BATAK (Pi DApp)</strong></div>
    <div>
      <span>Oyun Tokeni: <strong id="tokenBalance">10</strong> BTK</span>
      <button class="btn btn-ad" id="adBtn" onclick="watchPiRewardedAd()">📺 Pi Reklam İzle (+5 BTK)</button>
      <button class="btn btn-pi" id="piLoginBtn" onclick="authenticatePiUser()">Pi ile Giriş Yap</button>
    </div>
  </div>

  <div class="table" id="playersContainer"></div>

  <div class="controls">
    <h3>El Sonu Puan Simülasyonu (Başlangıç: -100)</h3>
    <button class="btn" onclick="addScore(0, 40)">Oyuncu 1 (+40)</button>
    <button class="btn" onclick="addScore(1, 55)">Oyuncu 2 (+55)</button>
    <button class="btn" onclick="addScore(2, 30)">Oyuncu 3 (+30)</button>
    <button class="btn" onclick="addScore(3, 60)">Oyuncu 4 (+60)</button>
    <br><br>
    <button class="btn btn-pi" onclick="finishGame()">Oyunu Bitir & Ödülleri Dağıt</button>
    <button class="btn" onclick="resetGame()">Yeni Oyun (-100)</button>
  </div>

  <script>
    // 1. Pi SDK Başlatma (Test/Geliştirme için sandbox: true, canlıya alırken false yapın)
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true });

    let tokens = 10;
    let piUser = null;

    let players = [
      { name: "Sen (Pi Oyuncusu)", score: -100, leaguePoints: 0 },
      { name: "Oyuncu 2", score: -100, leaguePoints: 0 },
      { name: "Oyuncu 3", score: -100, leaguePoints: 0 },
      { name: "Oyuncu 4", score: -100, leaguePoints: 0 }
    ];

    // 2. Pi Network Kullanıcı Girişi
    async function authenticatePiUser() {
      try {
        const scopes = ['username'];
        const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
        piUser = auth.user;
        players.name = `@${piUser.username}`;
        document.getElementById("piLoginBtn").innerText = `@${piUser.username}`;
        document.getElementById("piLoginBtn").disabled = true;
        renderPlayers();
      } catch (err) {
        alert("Lütfen bu uygulamayı Pi Browser üzerinden açın. Hata: " + err.message);
      }
    }

    function onIncompletePaymentFound(payment) {
      console.log("Tamamlanmamış ödeme:", payment);
    }

    // 3. Pi Network Ödüllü Reklam Gösterme (Gelir sizin Pi Developer hesabınıza yatar)
    async function watchPiRewardedAd() {
      const adBtn = document.getElementById("adBtn");
      adBtn.disabled = true;
      adBtn.innerText = "Reklam Kontrol Ediliyor...";

      try {
        // Cihazın Pi Reklam Ağını destekleyip desteklemediğini kontrol et
        const nativeFeatures = await Pi.nativeFeaturesList();
        if (!nativeFeatures.includes("ad_network")) {
          alert("Pi Browser sürümünüz reklamları desteklemiyor. Lütfen uygulamayı güncelleyin.");
          resetAdButton();
          return;
        }

        // Reklam hazır mı kontrol et, değilse yükle
        const isAdReadyResponse = await Pi.Ads.isAdReady("rewarded");
        if (!isAdReadyResponse.ready) {
          const requestAdResponse = await Pi.Ads.requestAd("rewarded");
          if (requestAdResponse.result !== "AD_LOADED") {
            alert("Şu anda gösterilecek reklam bulunamadı, biraz sonra tekrar deneyin.");
            resetAdButton();
            return;
          }
        }

        // Ödüllü reklamı ekranda göster
        const showAdResponse = await Pi.Ads.showAd("rewarded");
        
        if (showAdResponse.result === "AD_REWARDED") {
          // Güvenlik Notu: Canlı sistemde showAdResponse.adId değerini backend sunucunuzdan Pi Platform API ile doğrulamalısınız.
          tokens += 5;
          document.getElementById("tokenBalance").innerText = tokens;
          alert(`Reklam tamamlandı! (Ad ID: ${showAdResponse.adId}) 5 BTK Token kazandınız.`);
        } else {
          alert("Reklam tamamlanmadığı için ödül verilmedi.");
        }
      } catch (err) {
        alert("Reklam gösterilirken hata oluştu (Pi Browser dışında test ediyorsanız çalışmaz): " + err.message);
      }
      resetAdButton();
    }

    function resetAdButton() {
      const adBtn = document.getElementById("adBtn");
      adBtn.disabled = false;
      adBtn.innerText = "📺 Pi Reklam İzle (+5 BTK)";
    }

    // Puan Renk Kuralları
    function getCardClass(score) {
      if (score >= 100) return "rank-100";      // 100 ve üzeri -> Kırmızı
      if (score >= 50) return "rank-50";        // 50 - 99 arası -> Sarı
      return "rank-under50";                    // 50 altı -> Mavi
    }

    function renderPlayers() {
      const container = document.getElementById("playersContainer");
      container.innerHTML = "";
      players.forEach(p => {
        const cardClass = getCardClass(p.score);
        container.innerHTML += `
          <div class="player-card ${cardClass}">
            <h3>${p.name}</h3>
            <h2>Oyun Puanı: ${p.score}</h2>
            <p>Lig Puanı: <strong>${p.leaguePoints}</strong></p>
          </div>
        `;
      });
    }

    function addScore(index, points) {
      players[index].score += points;
      renderPlayers();
    }

    function finishGame() {
      let sorted = [...players].sort((a, b) => b.score - a.score);
      sorted.leaguePoints += 1;   // 1. olana 1 puan
      sorted.leaguePoints += 0.5; // 2. olana 0.5 puan

      alert(
        `Oyun Bitti!\n` +
        `1. ${sorted.name} (${sorted.score} puan) -> +1 Lig Puanı\n` +
        `2. ${sorted.name} (${sorted.score} puan) -> +0.5 Lig Puanı\n` +
        `3. ve 4. Oyuncular -> 0 Puan`
      );
      renderPlayers();
    }

    function resetGame() {
      players.forEach(p => p.score = -100);
      renderPlayers();
    }

    renderPlayers();
  </script>
</body>
</html>
