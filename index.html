<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>-100 Batak | Pi Network DApp (Tek Kişilik & Online)</title>
  <script src="https://minepi.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1025;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 12px;
      user-select: none;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #2b193d;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid #59357a;
      margin-bottom: 14px;
      gap: 8px;
    }
    .btn {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 3px;
      font-size: 13px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { background: #555 !important; color: #aaa !important; cursor: not-allowed; }
    .btn-pi { background: #f4b41a; color: #1a1025; }
    .btn-ad { background: #00c853; color: white; }
    .btn-online { background: #00b0ff; color: #1a1025; }
    .btn-danger { background: #e53935; color: white; }

    /* Mod Seçim Ekranı */
    .menu-box {
      background: #2b193d;
      border: 1px solid #59357a;
      border-radius: 14px;
      max-width: 600px;
      margin: 20px auto;
      padding: 24px 16px;
    }
    .mode-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px;
    }
    .mode-card {
      background: #1f122d;
      border: 2px solid #59357a;
      border-radius: 12px;
      padding: 18px;
    }
    .room-input {
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #59357a;
      background: #140b1e;
      color: #fff;
      width: 140px;
      text-align: center;
      font-weight: bold;
      margin-top: 8px;
    }

    /* Skor Tablosu */
    .scoreboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 720px;
      margin: 0 auto 14px auto;
    }
    .player-card {
      background: #252525;
      padding: 10px;
      border-radius: 10px;
      border: 2px solid #444;
      transition: all 0.3s ease;
    }
    .player-card h3 { margin: 2px 0; font-size: 14px; }
    .player-card h2 { margin: 4px 0; font-size: 17px; }
    .player-card p { margin: 2px 0; font-size: 12px; }
    .active-turn { box-shadow: 0 0 14px #f4b41a; transform: scale(1.02); }

    /* Puan Renk Kuralları */
    .rank-100 { background-color: #b71c1c !important; border-color: #ff5252; }
    .rank-50 { background-color: #fbc02d !important; color: #000 !important; }
    .rank-under50 { background-color: #0277bd !important; border-color: #4fc3f7; }

    /* Oyun Masası */
    .game-arena {
      background: #143d26;
      border: 2px solid #2e7d32;
      border-radius: 14px;
      max-width: 720px;
      margin: 0 auto 14px auto;
      padding: 14px;
      min-height: 215px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .status-bar {
      background: rgba(0,0,0,0.5);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #ffd54f;
      margin-bottom: 10px;
    }
    .trick-table {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 110px;
      flex-wrap: wrap;
    }
    .played-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: #c8e6c9;
    }
    .card {
      width: 54px;
      height: 80px;
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 17px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4);
      border: 1px solid #ccc;
    }
    .card.red { color: #d32f2f; }
    .card.black { color: #111111; }

    .hand-area {
      max-width: 720px;
      margin: 0 auto;
      background: #2b193d;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #59357a;
    }
    .my-cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .my-cards .card {
      cursor: pointer;
      transition: transform 0.15s;
    }
    .my-cards .card:hover {
      transform: translateY(-8px);
      border-color: #f4b41a;
    }
    .my-cards .card.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <!-- Üst Bilgi Barı -->
  <div class="header">
    <div><strong>🃏 -100 BATAK (Pi DApp)</strong></div>
    <div>
      <span>Token: <strong id="tokenBalance">10</strong> BTK</span>
      <button class="btn btn-ad" id="adBtn" onclick="watchPiRewardedAd()">📺 Reklam (+5 BTK)</button>
      <button class="btn btn-pi" id="piLoginBtn" onclick="authenticatePiUser()">Pi ile Giriş Yap</button>
    </div>
  </div>

  <!-- 1. ANA MENÜ (MOD SEÇİMİ) -->
  <div id="menuScreen" class="menu-box">
    <h2>Oyun Modu Seçin</h2>
    <p style="color:#ccc; font-size:14px;">Başlangıç Puanı: <strong>-100</strong> | 100 Puana ulaşan kazanır!</p>
    <div class="mode-cards">
      <!-- Tek Kişilik Botlu Mod -->
      <div class="mode-card">
        <h3>🤖 Tek Kişilik (Botlu)</h3>
        <p style="font-size:13px; color:#bbb;">3 akıllı yapay zeka botuna karşı anında oyna.</p>
        <button class="btn btn-pi" style="width:100%;" onclick="startSinglePlayer()">Botlarla Oyna (Ücretsiz)</button>
      </div>

      <!-- Online Çok Oyunculu Mod -->
      <div class="mode-card">
        <h3>🌐 Online Masa</h3>
        <p style="font-size:13px; color:#bbb;">Oda kodu kur veya arkadaşının odasına katıl (Giriş: 2 BTK).</p>
        <input type="text" id="roomCodeInput" class="room-input" placeholder="Oda Kodu (Örn: 1001)" maxlength="8">
        <br>
        <button class="btn btn-online" style="width:100%; margin-top:8px;" onclick="joinOnlineRoom()">Masaya Otur (2 BTK)</button>
      </div>
    </div>
  </div>

  <!-- 2. OYUN EKRANI -->
  <div id="gameScreen" style="display:none;">
    <div class="scoreboard" id="playersContainer"></div>

    <div class="game-arena">
      <div class="status-bar" id="statusText">Hazırlanıyor...</div>
      <div id="bidPanel" style="display:none; margin:8px 0;"></div>
      <div class="trick-table" id="trickTable"></div>
    </div>

    <div class="hand-area">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
        <strong id="modeBadge">Mod: Tek Kişilik</strong>
        <div>
          <button class="btn btn-pi" id="newHandBtn" onclick="startNewHand()">Yeni El Dağıt</button>
          <button class="btn" onclick="resetFullGame()">Skoru Sıfırla</button>
          <button class="btn btn-danger" onclick="backToMenu()">Ana Menü</button>
        </div>
      </div>
      <div class="my-cards" id="myHand"></div>
    </div>
  </div>

  <script>
    let tokens = 10;
    let piUser = null;
    let piSessionToken = null;
    let piInitialized = false;
    let myUserName = "Sen (Pi Oyuncusu)";

    const SUITS = [
      { id: 'S', symbol: '♠', name: 'Maça', color: 'black' },
      { id: 'H', symbol: '♥', name: 'Kupa', color: 'red' },
      { id: 'C', symbol: '♣', name: 'Sinek', color: 'black' },
      { id: 'D', symbol: '♦', name: 'Karo', color: 'red' }
    ];
    const RANKS = [
      { v: 2, label: '2' }, { v: 3, label: '3' }, { v: 4, label: '4' },
      { v: 5, label: '5' }, { v: 6, label: '6' }, { v: 7, label: '7' },
      { v: 8, label: '8' }, { v: 9, label: '9' }, { v: 10, label: '10' },
      { v: 11, label: 'J' }, { v: 12, label: 'Q' }, { v: 13, label: 'K' },
      { v: 14, label: 'A' }
    ];

    let gameMode = 'SINGLE'; // SINGLE veya ONLINE
    let onlineChannel = null;
    let mySeatIndex = 0;
    let currentRoomCode = "";

    let players = [];
    let trumpSuit = 'S';
    let currentTurn = 0;
    let trickCards = [];
    let gameState = 'IDLE';
    let highestBid = 4;
    let bidderIndex = -1;

    // --- PI NETWORK SDK ---
    async function initPiSdk() {
      if (!piInitialized && window.Pi) {
        await window.Pi.init({ version: "2.0" });
        piInitialized = true;
      }
    }

    async function authenticatePiUser() {
      try {
        await initPiSdk();
        const auth = await window.Pi.authenticate(['username'], () => {});
        const res = await fetch("https://piappengine.com", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accessToken: auth.accessToken })
        });
        if (!res.ok) throw new Error("App Studio oturum doğrulaması başarısız.");
        const sessionData = await res.json();
        piSessionToken = sessionData.sessionToken;
        piUser = sessionData.user;
        myUserName = `@${piUser.username}`;
        document.getElementById("piLoginBtn").innerText = myUserName;
        document.getElementById("piLoginBtn").disabled = true;
        if (players[mySeatIndex]) {
          players[mySeatIndex].name = myUserName;
          renderPlayers();
        }
      } catch (err) {
        console.warn("Pi Auth bilgi:", err.message);
      }
    }

    async function watchPiRewardedAd() {
      const adBtn = document.getElementById("adBtn");
      adBtn.disabled = true;
      adBtn.innerText = "Kontrol Ediliyor...";
      try {
        await initPiSdk();
        const isAdReady = await window.Pi.Ads.isAdReady("rewarded");
        if (!isAdReady.ready) {
